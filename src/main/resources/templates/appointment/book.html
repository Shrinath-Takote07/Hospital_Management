<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - HMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-teal-50 via-cyan-50 to-blue-100 min-h-screen">

<!-- Navbar -->
<nav class="bg-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i class="fas fa-hospital text-2xl text-teal-600"></i>
            <h1 class="text-xl sm:text-2xl font-bold text-teal-700">Book Appointment</h1>
        </div>
        <a href="/dashboard" class="text-gray-600 hover:text-teal-600 text-sm sm:text-base font-medium">
            ← Back to Dashboard
        </a>
    </div>
</nav>

<div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
    <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 lg:p-10">

        <div class="text-center mb-8">
            <i class="fas fa-calendar-plus text-6xl text-teal-600 mb-4"></i>
            <h2 class="text-2xl sm:text-3xl font-bold text-gray-800">Schedule Your Visit</h2>
            <p class="text-gray-600 mt-2">Choose your doctor and preferred time</p>
        </div>

        <!-- Success/Error Messages -->
        <div th:if="${msg}" class="mb-6 p-4 bg-green-50 border border-green-300 rounded-xl text-green-800 font-semibold flex items-center gap-3">
            <i class="fas fa-check-circle text-green-600 text-xl"></i>
            <span th:text="${msg}"></span>
        </div>
        <div th:if="${success}" class="mb-6 p-4 bg-green-50 border border-green-300 rounded-xl text-green-800 font-semibold flex items-center gap-3">
            <i class="fas fa-check-circle text-green-600 text-xl"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="mb-6 p-4 bg-red-50 border border-red-300 rounded-xl text-red-800 font-semibold flex items-center gap-3">
            <i class="fas fa-exclamation-triangle text-red-600 text-xl"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/appointment/book}" method="post" class="space-y-6">

            <!-- Doctor Selection -->
            <div>
                <label class="block text-lg font-semibold text-gray-700 mb-3 flex items-center gap-2">
                    <i class="fas fa-user-md text-teal-600"></i> Select Doctor
                </label>
                <select name="doctorId" id="doctorIdSelect" required
                        class="w-full px-5 py-4 border-2 border-gray-300 rounded-xl focus:border-teal-500 focus:ring-4 focus:ring-teal-100 transition text-base font-medium">
                    <option value="">-- Choose a Specialist Doctor --</option>
                    <option th:each="doc : ${doctors}"
                            th:value="${doc.id}"
                            th:text="|${doc.name} ${doc.specialization != null ? '- ' + doc.specialization : ''} (Fee: ₹${doc.fees != null ? doc.fees : 500}) [${doc.availableStatus != null ? doc.availableStatus : 'AVAILABLE'}]|">
                        Dr. Sarah Jenkins - Cardiology (Fee: ₹500.00) [AVAILABLE]
                    </option>
                </select>
            </div>

            <!-- Appointment Type Selection -->
            <div>
                <label class="block text-lg font-semibold text-gray-700 mb-3 flex items-center gap-2">
                    <i class="fas fa-notes-medical text-teal-600"></i> Appointment Type
                </label>
                <select name="appointmentType" required
                        class="w-full px-5 py-4 border-2 border-gray-300 rounded-xl focus:border-teal-500 focus:ring-4 focus:ring-teal-100 transition text-base font-medium">
                    <option value="REGULAR" selected>🩺 REGULAR - Routine Checkup</option>
                    <option value="URGENT">🚨 URGENT - Urgent / Priority Care</option>
                    <option value="FOLLOW_UP">🔄 FOLLOW_UP - Follow-up Visit</option>
                </select>
            </div>

            <!-- Describe Problem / Message to Doctor -->
            <div>
                <label class="block text-lg font-semibold text-gray-700 mb-3 flex items-center gap-2">
                    <i class="fas fa-comment-medical text-teal-600"></i> Message to Doctor / Symptoms & Problem Details
                </label>
                <textarea name="patientMessage" rows="3" placeholder="Describe your health problem, symptoms, or any message for the doctor..."
                          class="w-full px-5 py-4 border-2 border-gray-300 rounded-xl focus:border-teal-500 focus:ring-4 focus:ring-teal-100 transition text-base"></textarea>
            </div>

            <!-- Date & Time -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-3 flex items-center gap-2">
                        <i class="fas fa-calendar text-teal-600"></i> Date
                    </label>
                    <input type="date" id="appointmentDateInput" name="date" required
                           class="w-full px-5 py-4 border-2 border-gray-300 rounded-xl focus:border-teal-500 focus:ring-4 focus:ring-teal-100 transition text-base">
                </div>
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-3 flex items-center gap-2">
                        <i class="fas fa-clock text-teal-600"></i> Time
                    </label>
                    <input type="time" name="time" required
                           class="w-full px-5 py-4 border-2 border-gray-300 rounded-xl focus:border-teal-500 focus:ring-4 focus:ring-teal-100 transition text-base">
                </div>
            </div>

            <!-- Submit Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 pt-4">
                <button type="submit"
                        class="w-full bg-gradient-to-r from-teal-600 to-cyan-600 text-white font-bold text-lg py-4 rounded-xl hover:from-teal-700 hover:to-cyan-700 transform hover:scale-105 transition shadow-xl flex items-center justify-center gap-3">
                    <i class="fas fa-check-circle"></i>
                    Confirm & Send to Doctor
                </button>
                <a href="/patient/dashboard"
                   class="w-full bg-gray-200 text-gray-700 font-bold text-lg py-4 rounded-xl hover:bg-gray-300 text-center transition flex items-center justify-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    // Set minimum date to today's date automatically
    document.addEventListener("DOMContentLoaded", function() {
        const today = new Date().toISOString().split('T')[0];
        const dateInput = document.getElementById('appointmentDateInput');
        if (dateInput) {
            dateInput.min = today;
            if (!dateInput.value) {
                dateInput.value = today;
            }
        }
    });
</script>
</body>
</html>
