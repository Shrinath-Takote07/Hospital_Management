<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - HMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-green-50 to-teal-100 min-h-screen flex items-center justify-center p-4 py-8">
<div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-xl">
    <div class="text-center mb-6">
        <h1 class="text-3xl font-bold text-teal-700">Create Patient Account</h1>
        <p class="text-xs text-gray-500 mt-1">Complete your registration by providing required Govt ID & Photo</p>
    </div>
    
    <form th:action="@{/register}" th:object="${patient}" method="post" enctype="multipart/form-data" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Full Name *</label>
                <input type="text" th:field="*{name}" required placeholder="John Doe" class="w-full px-3.5 py-2.5 border rounded-xl focus:ring-2 focus:ring-teal-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Email Address *</label>
                <input type="email" th:field="*{email}" required placeholder="patient@example.com" class="w-full px-3.5 py-2.5 border rounded-xl focus:ring-2 focus:ring-teal-500 text-sm">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Password *</label>
                <input type="password" name="password" required minlength="6" placeholder="••••••••" class="w-full px-3.5 py-2.5 border rounded-xl focus:ring-2 focus:ring-teal-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Contact Number *</label>
                <input type="text" th:field="*{phone}" required placeholder="+91 9876543210" class="w-full px-3.5 py-2.5 border rounded-xl focus:ring-2 focus:ring-teal-500 text-sm">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Permanent Residential Address (Compulsory) *</label>
            <textarea th:field="*{permanentAddress}" required rows="2" placeholder="House No., Street, City, State, Pincode" class="w-full px-3.5 py-2 border rounded-xl focus:ring-2 focus:ring-teal-500 text-sm outline-none"></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Gender</label>
                <select th:field="*{gender}" class="w-full px-3.5 py-2.5 border rounded-xl focus:ring-2 focus:ring-teal-500 text-sm bg-white">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Date of Birth</label>
                <input type="date" th:field="*{dob}" class="w-full px-3.5 py-2.5 border rounded-xl focus:ring-2 focus:ring-teal-500 text-sm">
            </div>
        </div>

        <div class="border-t border-teal-100 pt-4 mt-2">
            <h3 class="text-sm font-bold text-teal-800 mb-3 flex items-center gap-1">
                🆔 Government ID & Photo Identity Verification (Mandatory)
            </h3>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Govt ID Type *</label>
                    <select th:field="*{govtIdType}" required class="w-full px-3.5 py-2.5 border rounded-xl focus:ring-2 focus:ring-teal-500 text-sm bg-white">
                        <option value="Aadhar Card">Aadhar Card</option>
                        <option value="PAN Card">PAN Card</option>
                        <option value="Passport">Passport</option>
                        <option value="Voter ID">Voter ID</option>
                        <option value="Driver License">Driver License</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Govt ID Number *</label>
                    <input type="text" th:field="*{govtIdNumber}" required placeholder="e.g. 1234 5678 9012" class="w-full px-3.5 py-2.5 border rounded-xl focus:ring-2 focus:ring-teal-500 text-sm">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Upload Govt ID Document *</label>
                    <input type="file" name="govtIdFile" accept="image/*,.pdf" required class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 cursor-pointer border rounded-xl p-1">
                    <p class="text-[10px] text-gray-400 mt-0.5">Image or PDF (Max 5MB)</p>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Upload Original Photo *</label>
                    <input type="file" name="photoFile" accept="image/*" required class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 cursor-pointer border rounded-xl p-1">
                    <p class="text-[10px] text-gray-400 mt-0.5">Clear headshot image</p>
                </div>
            </div>
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-teal-600 to-cyan-600 text-white font-bold py-3 rounded-xl hover:from-teal-700 hover:to-cyan-700 transition shadow-lg mt-4">
            Complete Registration
        </button>
    </form>
    <div th:if="${error}" class="mt-4 p-4 bg-red-50 border border-red-300 text-red-700 rounded-xl text-sm font-semibold">
        [[${error}]]
    </div>
    <p class="text-center mt-6 text-sm"><a href="/login" class="text-teal-600 font-semibold hover:underline">Already registered? Login</a></p>
</div>
</body>
</html>
